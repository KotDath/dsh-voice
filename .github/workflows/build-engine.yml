name: build-engine

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsh-voice
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build plugin bundles
        run: node scripts/build-plugin.mjs

      - name: Syntax-check bundles
        run: |
          node --check dist/host.js
          node --check dist/client.js

      - name: Run host tests
        run: node test/run.mjs

      - name: Run client tests
        run: node test/client.test.mjs

  engine:
    # Engine binaries are release artifacts: build them only on v* tags (and
    # manual dispatch), not on every push to main.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: transcribe-cli-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: transcribe-cli-linux-arm64
          - os: macos-14
            asset: transcribe-cli-macos-arm64
          - os: macos-15-intel
            asset: transcribe-cli-macos-x86_64
          - os: windows-latest
            asset: transcribe-cli-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout transcribe.cpp
        uses: actions/checkout@v4
        with:
          repository: handy-computer/transcribe.cpp
          ref: v0.2.0
          path: transcribe.cpp

      # MSVC environment for the whole job: without vcvars, CMake silently
      # picks the runner image's MinGW gcc (upstream observed gcc-flavored
      # M_PI errors). The Ninja generator also needs cl.exe on PATH.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake)
        working-directory: transcribe.cpp
        env:
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Ninja' || '' }}
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DTRANSCRIBE_BUILD_TESTS=OFF
          -DTRANSCRIBE_BUILD_TOOLS=OFF
          -DTRANSCRIBE_BUILD_EXAMPLES=ON
          -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF

      - name: Build transcribe-cli
        working-directory: transcribe.cpp
        run: cmake --build build --target transcribe-cli -j 4

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          if [ -f transcribe.cpp/build/bin/transcribe-cli ]; then
            echo "path=transcribe.cpp/build/bin/transcribe-cli" >> "$GITHUB_OUTPUT"
          else
            echo "path=transcribe.cpp/build/bin/Release/transcribe-cli.exe" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage asset with platform name
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ steps.bin.outputs.path }}" "dist/${{ matrix.asset }}"

      - name: Generate checksum sidecar
        shell: bash
        run: |
          cd dist
          sha256sum "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
